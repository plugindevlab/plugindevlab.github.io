antlion:
  - version: "1.0.7"
    date: "2026-10-08"
    title: Wheelchair platform rows are checked where people actually sit
    body: |
      **Section analysis**

      - On a tier with a wheelchair platform (Wheelchair Merge on), the top two rows become the
        platform and hold no regular seats. The row in front of the platform is now checked against
        the wheelchair users' eye: at the front of the platform, at platform level, using the
        wheelchair eye height from your settings.
      - The first platform row no longer gets a C-value, because no one sits behind it. Before, it
        was checked as if a seated spectator sat there, which could show a POOR that was not real -
        also on workbook page 80_RESULT_ROWS. Report now names the platform rows.
      - Tiers without a wheelchair platform are unchanged. The preview columns on page
        10_INPUT_SECTION still use the regular eye height for every row; page 80_RESULT_ROWS has
        the analysed values.
  - version: "1.0.6"
    date: "2026-10-07"
    title: Custom vomitories can be stepped, stair or ramp
    body: |
      **Custom Seat**

      - New optional input Vomitory, right below Stand 2D. Wire it from Vomitory and each vomitory
        you draw in Custom Voms gets its tier's descent - stepped, stair or ramp - from the Vomitory
        settings. Before, every custom vomitory was built flat. Only the settings are used: your
        outlines stay exactly as drawn, and if one is too short for the headroom over the stairs,
        you are told where.
      - Because the new input sits below Stand 2D, the inputs from Custom Voms down move one place.
        Older files reconnect by input name when opened. To get the new input in an older file,
        place a fresh Custom Seat.
      - On a tier where you drew Custom Steps, no automatic aisle cells are added beside or behind
        vomitories any more - your cells are used as drawn. A white note lists the spots left out.

      **Rail 3D**

      - Front railings are now cleared across a vomitory whose front edge lies exactly on the front
        of the tier. Before, thin pieces of railing could be left standing in the opening.

      **Vom 3D**

      - The note that the descent runs past the opening is orange only when the stairs actually run
        into the end wall beside the opening. When they just pass out through the opening, it is a
        white note with the length.
  - version: "1.0.5"
    date: "2026-10-07"
    title: Overlapping seats are removed
    body: |
      **Seat and Custom Seat**

      - When two seats in the same tier overlap, only one is kept. This mostly happens where the
        rows turn at an axis line, for example at the corners of a chamfered bowl. The seat that
        reaches further across the axis line is removed. Seats in different tiers are never
        compared.
      - Seat now removes a seat that overlaps an aisle step, as Custom Seat already did, so the
        aisle stays clear. This showed up beside vomitories at the corners of a chamfered bowl.
      - Even a small overlap removes the seat, because two chairs there would clash. Seat counts
        can be slightly lower than in 1.0.4 on curved and chamfered bowls.
  - version: "1.0.4"
    date: "2026-10-06"
    title: Shorter package description
    body: |
      - No changes to the components. The package description in Rhino's Package Manager and on
        Food4Rhino is now a single short summary. The package's website link goes to the
        Food4Rhino page, which links to the documentation and the video tutorial.
  - version: "1.0.3"
    date: "2026-10-06"
    title: Sightlines line up with seat statuses again
    body: |
      **C-value Seat and C-value Tread**

      - *Sightlines* keep one item per seat or cell again, in the same order as *Seat Statuses*
        and *Band Statuses*. A seat or cell without a sightline (for example, no focal point in
        front of it) now leaves an empty item instead of being skipped, so filtering the
        sightlines by status picks the right lines. Before, every line after the first gap moved
        up by one.
      - *Map Hatches* on C-value Seat keep an empty item where a hatch could not be made, so they
        stay in step with *Seat C-Values*.

      **Seat**

      - With a negative *End Offset* that removes a vomitory near the end of the stand,
        *Vom Shifts* now lists only the vomitories that remain, in the same order as *Vom Rects*.

      **Package**

      - The package page in Rhino's Package Manager links to the website, Food4Rhino and the
        YouTube tutorial, and the package includes a copy of the licence agreement
        (`misc/LICENSE.txt`).
  - version: "1.0.2"
    date: "2026-10-06"
    title: Report a problem and manage your subscription from the License component
    body: |
      **License component menu**

      - Right-click the License component for two new items. *Manage subscription* opens your
        customer portal. *Report a problem* opens the problem-report form with your Antlion,
        Rhino and Windows versions and your document units already attached, and copies the same
        details — with the last error message, if there was one — to the clipboard.

      **Offline use**

      - When Antlion has not been able to check your license for a while, the warning now counts
        the hours left. Before, it said "0 more day(s)" for the whole last day.
  - version: "1.0.1"
    date: "2026-10-05"
    title: Inch documents — lengths read the way you set Rhino's units
    body: |
      **Lengths in messages and reports**

      - Lengths now follow the distance display in Rhino's Document Properties → Units.
        Decimal documents show decimals (`4.75 in`), fractional documents show fractions
        (`4-3/4 in`), and Feet & Inches documents show `1'-6 3/8"`.
      - A value you typed comes back exactly as you typed it. Before, some messages rounded
        inch values to the whole inch — a minimum C-value of 2.5 in could read as `2in`.
      - The same value now reads the same in every message, and two different values that a
        message compares never print as the same number.

      **Inch defaults**

      - New components in inch documents start from round inch values instead of converted
        millimeters — for example a minimum C-value of 3-1/2 in, an optimal C-value of 4-3/4 in,
        an eye height of 48 in and a seat depth of 20 in. Values already in your files do not
        change, and millimeter documents are unchanged.

      **Other**

      - The plugin's contact link in Grasshopper's info window now points to the problem-report page.

      Tip — Grasshopper reads `12-3/4` typed into a panel as 12 minus 3/4. Type inch values as
      decimals (`12.75`).
  - version: "1.0.0"
    date: "2026-10-05"
    title: First public release — the seating bowl
    body: |
      It covers the seating bowl, from the field outline to the sightline drawings.

      **Build the bowl**

      - Field presets, with the focal point every sightline aims at. Rectangle, capsule and oval
        start lines, or your own curve.
      - Section axes laid out along the start line, or taken from your own axis curves.
      - Sections three ways — drawn as tread lines, solved from a target C-value, or read from a
        workbook — with front railings and wheelchair platforms.
      - Vomitories that run flat, step down or ramp down to the concourse.
      - Seats and aisles laid out automatically, or from your own seat, aisle and wheelchair-space
        curves.
      - Cuts and openings by axis number or by curve, chained one after another.
      - 3D solids for the stands, vomitories, railings, chairs and seated spectators.

      **Check the sightlines**

      - C-value per seat and per tread band across the whole bowl, colored by a legend you set.
      - Section checks with sightlines and dimensions, one sheet per axis.
      - C-value maps and seat maps on drawing sheets — zones, seat counts, wheelchair spaces and
        seat addresses.
      - A view from any seat, in the Perspective viewport.

      **Tables**

      - Step heights, tread depths, tier settings and the C-value target read from a Google Sheets
        or Excel workbook, with the results written back.

      **Also**

      - Millimeter and inch documents.
      - The Util panel works without a license.
      - Rhino 8 for Windows, running on .NET Core.
