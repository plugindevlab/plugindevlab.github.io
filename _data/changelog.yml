antlion:
  - version: "1.0.19"
    date: "2026-10-19"
    title: PERPENDICULAR sight lines on track ends, and wide straight vomitories as bands
    body: |
      **Fixed**

      - **C-value Seat**, **C-value Tread** - With Focal Aim Mode set to PERPENDICULAR on a focal curve made of
        straight and arc pieces, such as a running track, some sight lines at the curved ends missed the near
        curve and aimed at the far straight across the field, so their C-values came out wrong or empty. The
        focal point is now always found on the near curve, and the two aim modes agree there. C-value Tread
        finds the field crossing of its sections the same way in either aim mode.
      - **Custom Seat** - A four-corner vomitory was always read as one rect however long it was, so a wide
        opening drawn along a straight side could not work as a band the way one bent around a corner does. A
        rect that crosses an axis line is now a band: it is split at each axis line, gets a band number, has
        doors at both ends, and follows Vom 3D's Band Opening Mode. Vomitories that stay between two axis
        lines come out as before.
      - **Custom Seat** - A band edge drawn between two tread rings could be taken for the end of the band,
        which put a side aisle as long as that edge beside the band and raised the hint about an aisle cell
        much wider than the aisle width. An edge that runs along the rings is now always read that way.
  - version: "1.0.18"
    date: "2026-10-18"
    title: Aisle steps near corners and wide vomitories no longer overlap
    body: |
      **Fixed**

      - **Seat**, **Custom Seat** - With Aisle Split Mode on, an automatic aisle could stand closer than one
        aisle width to the aisle beside it: where a straight side turns into a corner, next to the side aisle
        of a wide vomitory, or next to an aisle that shifts toward the wall above a vomitory. Their aisle step
        cells overlapped, and Stand 3D Plus could build one flight of steps into another. The automatic aisle
        now gives way on the treads where its cells would overlap another aisle's. Seats and warnings come out
        as before.
      - **Custom Seat** - Custom step cells from two different aisles near a corner could be read as one
        aisle that stretched across both, so the cell grew several metres wide and the hint reported a cell
        much wider than the aisle width. Cells are now matched to an aisle by their distance along their own
        tread, so each aisle keeps its own width. Where an aisle shifts sideways by more than its width
        between two bands of a rounded corner, the two parts now count as separate aisles; the seats and
        cells stay the same.
  - version: "1.0.17"
    date: "2026-10-16"
    title: Aisle steps now add a step when the tread is deep enough
    body: |
      **Fixed**

      - **Seat** - Aisle steps stopped at two per row however deep the tread was, so a tall riser always
        climbed in three rises - a 600 mm riser became three 200 mm rises even on a tread with room for more.
        The number of steps now follows the tread: every step, and the landing at the row, keeps at least
        280 mm (11 in) of going, so a tread of 1,120 mm (44 in) or more takes three steps and the same riser
        climbs in four 150 mm rises. Treads shorter than that come out exactly as before, and Stand 3D Plus
        builds whatever Seat lays out.
      - **Seat** - When a riser still needs more steps than its tread can hold, the hint now names the
        steepest case: the riser, the tread, the rise per step, and the tread depth one more step would need.
      - In inch documents an aisle step's going is now 11 in instead of 11.02 in.
  - version: "1.0.16"
    date: "2026-10-15"
    title: Stands built from different sections now each keep their own shape
    body: |
      **Fixed**

      - **Stand 3D** - On a bowl that runs all the way around, two sections that start at the same front point
        and reach the same height and depth could come out as the same stand: the second Stand 3D quietly
        output the first one's body. Wired through Assemble Bowl, Stand 3D Plus then built every branch with
        the first section while the seats followed the right one. Editing a section without moving its front
        point or outer edge did the same until Rhino was restarted. Each stand now always matches its own section.
      - **Cut** - A smooth cut curve made of a single span could be mistaken for its mirror image, so a cut
        could follow the earlier curve's path. Each curve is now read for its own shape.
      - **Seat 3D** - A custom chair and its left-right mirror image, such as an armrest moved to the other
        side, could reuse the first chair's block, so the change never reached the baked seats. The block now
        follows the geometry. A file baked before this update gets one new chair block the next time you bake;
        the old block stays in the file.
  - version: "1.0.15"
    date: "2026-10-14"
    title: A wrongly wired input now stops the component at once, and Field gets nine more sports
    body: |
      **Fixed**

      - **All components** - An input that takes one result from another component, such as Custom Seat's VD,
        made the whole component run once for every item that reached it. Curves wired there by mistake were
        quietly ignored, so 63 curves meant the same bowl laid out 63 times - minutes of work and gigabytes of
        memory before anything came back. Now the component stops at once with one red message that names the
        input, how many items reached it and where they came from. Nothing downstream runs on the bad data.
      - **Field** - The 400 m track outline followed the lane 1 measuring line, 8.85 m inside the centre of the
        outermost lane that athletics sightlines aim at, so stands came out too far from the focal line and
        C-values looked better than they are. The outline is now the outside edge of lane 8. To aim at the centre of the
        outermost lane, use Focal Direction HORIZONTAL with a Focal Offset of 610 mm. Files using the track
        change when they recalculate - nothing to rewire.
      - **Field** - On the track, the east and west half positions put the base point at the centre of the
        semicircle instead of on the outline. It now sits at the tip of the semicircle, on the outline.
      - **Field** - Rugby union was 100 × 70 m without its in-goal areas, so end stands were measured from a
        boundary up to 22 m too far away. It is now 120 × 70 m, in-goal included.
      - **Field** and **View Limit** - When an update changed the Sport Mode list, a wired Value List could fall
        back to its first choice and quietly switch your sport to soccer. Your choice is now kept.
      - **Field** - A custom curve that is not closed now says so first, instead of first asking for a focal point.
      - **Field** - On a custom rectangle, the east half position depended on the direction the curve was drawn
        and could land on the west side. It now always takes the end toward Base Plane X.

      **Added**

      - **Field** - Nine sports whose rules fix one size: an NHL ice rink, an NBA court, Canadian football,
        rugby league, field hockey, volleyball, netball, badminton and a 50 m pool.
      - **Field** - Each Sport Mode choice now reads sport · rule · metric or imperial, so you can see which
        rulebook a size comes from and in which units it is defined.
      - **Field** - A custom outline that touches the middle of each side of its bounding rectangle - a track,
        a rounded rectangle, an ellipse - can now use the four half positions, Focal Offset and HORIZONTAL like
        the presets when no Custom Focal Point is wired. Before, only a plain rectangle could, and anything else
        needed a Custom Focal Point. A wired Custom Focal Point still wins, so older files keep aiming where they did.
      - **Field** - A note when a Custom Focal Point sits more than 5 m outside the field.
  - version: "1.0.14"
    date: "2026-10-12"
    title: Millimeters, inches and feet now give the same results in five places
    body: |
      **Fixed**

      - **Cut** - A wheelchair platform band that ran almost all the way around a tier could not be trimmed
        back to the wheelchair spaces left after a cut, and stayed whole with a warning. It is now trimmed:
        the band sits under every remaining wheelchair space and stops there.
      - **C-value Seat** - When the nearest seat in the row ahead sat exactly 2 m to the side, rounding decided
        whether that row counted as occupied, so the same seat could get a very different value depending on
        the model's units (90.2 mm in feet, 1,063 mm in inches in our test). A seat exactly 2 m to the side now
        always counts as in front, the cautious reading. Some seats right behind a gap in the row ahead show a
        lower value than before; none changed between pass and fail in our test bowls.
      - **Opening Cut** - A vomitory-type opening that reaches the front row now opens the front railing across
        its full width, as an opening between two axes already did. Before, rounding decided it: the railing
        could run straight across the opening, or break off at an odd point inside it.
      - **Assemble Bowl** - Where two branches meet, a seat of one branch standing on an aisle step of the other
        is now removed so the aisle stays clear, and a note says where. Before, the seat stayed and the
        component only warned. Seats on seats and steps on steps still raise the warning as before.
      - **Custom Seat** - An aisle cell drawn exactly one and a half aisle widths to the side of the cell below
        could join that aisle or start a new one, depending on the model's units. It now always joins, as the
        rule says (up to one and a half aisle widths).
  - version: "1.0.13"
    date: "2026-10-11"
    title: Section Analysis and C-value Mode now spelled like the rest of Antlion
    body: |
      **Fixed**

      - **Section Analysis** - The component was spelled "Section analysis", unlike every other component
        name. It is now "Section Analysis". A component already on your canvas takes the new name when you
        open the file, unless you renamed it yourself.
      - **Section Analysis and Table In** - The C-Value Mode port is now spelled C-value Mode, like the
        C-value components. Wires and values you already set stay where they are.
  - version: "1.0.12"
    date: "2026-10-10"
    title: Two descriptions corrected - Field, and the Rail Result input of the C-value components
    body: |
      **Fixed**

      - **C-value Seat and C-value Tread** - The Rail Result input said that leaving it unwired means
        railings are not checked. That was wrong: when the Build Result you wire already takes Rail Result,
        railings are read from there. The description now says so. Only the description changed.
      - **Field** - The description pointed to field_info, a name you never see on the canvas. It now names
        the Field Info output. Only the description changed.

      Components already on your canvas keep their old descriptions until you place them again.
  - version: "1.0.11"
    date: "2026-10-09"
    title: Seats with nobody in front are measured against the railing actually in front of them
    body: |
      **Fixed**

      - **C-value Seat** - When no one sat within 2 m straight in front of a seat, it was graded against a
        made-up spectator standing on the empty floor ahead, borrowed from a seat as far as 20 m to the side.
        Seats behind an empty row could come out POOR although the view was clear (76.8 mm instead of
        397.8 mm in our test bowl). Such seats are now graded against the real railing or wall in front of
        them, or get no value when there is none.
      - **C-value Seat and C-value Tread** - A front row with no railing of its own could be graded against
        the railing of a lower tier many metres ahead, even when the view passes well over it (1,335.8 mm
        from a railing 11.65 m away in our arena). A railing of another tier now counts only when it
        really blocks the view, as it already did for every other row.
      - **C-value Tread** - Where a vomitory opening takes up the middle of a band, the band's front row was
        measured over the open passage, where nobody sits and nothing blocks the view. It is now measured
        at the nearest seats of that row, against the railing built in front of them. On a tier's first
        row this gives the same value as C-value Seat for those seats.
  - version: "1.0.10"
    date: "2026-10-08"
    title: Row and tier numbers count from 1 everywhere, and railings are only checked when Rail 3D is wired
    body: |
      **Fixed**

      - **Section Plus** - The wheelchair sightline check used Min C Over Rail, the pass mark for the
        barrier, so the same wheelchair C-value could pass here and fail in Section analysis. It now uses
        the value each tier was designed for, as Section analysis does. Min C Over Rail is for the barrier only.
      - **C-value Seat and C-value Tread** - With Rail 3D not wired, railings were guessed from the cut and
        opening edges at the front barrier height, and the front barrier itself was missing, so the first
        row of each tier silently had no value. Railings are now checked only when Rail 3D is wired; without
        it an orange message says which seats get no railing value.
      - **Row and tier numbers** - Rows were counted from 0 in messages, in C-value Tread item names and on
        the workbook result pages, and the result pages also counted tiers and stand sections from 0 while
        Seat Map and the seat addresses count from 1. Row, tier and stand section numbers now count from 1
        everywhere you read them. Columns ending in _index and axis numbers keep counting from 0.
      - **Seat View** - The Focal Point output was described as the point the seat is graded against. It is
        the point the camera aims at; the point C-value Seat grades against is a point this view must show.
        Only the description changed.
  - version: "1.0.9"
    date: "2026-10-08"
    title: Wheelchair places on tiers without Wheelchair Merge are measured where they really are
    body: |
      **Fixed**

      - **C-value Seat** - On a wheelchair tier with Wheelchair Merge off (the default), the wheelchair
        spaces sit on the top row, and Section Plus and Section analysis measure them there. C-value Seat
        measured them one row further forward, at the height a merged platform would have had - a platform
        that is not built when Merge is off - so wheelchair places came out OK when they were not (313.8 mm
        instead of 49.7 mm in our test bowl). It now measures each wheelchair place on the tread it actually
        stands on and gives the same value as Section analysis. Expect wheelchair results on tiers without
        Merge to look worse than in 1.0.8: these are the real values.
      - **C-value Tread** - On the same tiers it measured the wheelchair row with the seated eye height
        instead of your Wheelchair Eye Vertical Offset. It now uses the wheelchair eye height there too.
      - **Section Plus** - A barrier or wheelchair C-value exactly equal to the minimum could be reported
        as below it while Section analysis passed it. Both now use the same boundary.
      - **Table Out** - On the seat summary page (88), a seat whose C-value equals the Optimal C-Value could
        be left out of the optimal count in inch documents. It is now counted.
  - version: "1.0.8"
    date: "2026-10-08"
    title: Stands stay at their design height when the focal curve is raised
    body: |
      **Fixed**

      - **Stand 3D Plus, Rail 3D, Vom 3D, Stand 3D** - When Field's Focal Offset raised the focal
        curve (for example by 500 mm), the 3D stand, its railings and its vomitories were built that
        much lower than the section you designed, and the Stand 3D preview sat lower again. The stand
        now stays at its design height whatever the Focal Offset, and Stand 3D and Stand 3D Plus show
        it in the same place.
      - **C-value Seat and C-value Tread** - With a raised focal curve they measured from that lowered
        floor, so C-values came out higher than they really are (about 35 mm too high at the front row
        with a 500 mm offset in our test bowl). They now agree with Section analysis row by row.
      - **Section Plus** - On a tier with a wheelchair platform, the wheelchair sightline check was taken
        from the back of the platform, outside the wheelchair space. It is now taken from the front of the
        platform, where wheelchair users sit, and gives the same value as Section analysis.
      - **C-value Seat and C-value Tread** - Wheelchair spaces ignored your wheelchair eye height setting
        (Wheelchair Eye Vertical Offset) and used the seated eye height. They now use the setting
        (1150 mm by default); companion seats keep the seated eye height. With the default setting,
        wheelchair C-values are about 50 mm lower than in 1.0.7.

      Files made with earlier versions update when they recompute - there is nothing to rewire.
  - version: "1.0.7"
    date: "2026-10-08"
    title: Wheelchair platform rows are checked where people actually sit
    body: |
      **Fixed**

      - **Section analysis** - On a tier with a wheelchair platform (Wheelchair Merge on), the top two
        rows are the platform and hold no regular seats, but the first platform row was checked as if
        a seated spectator sat there. That could show a POOR that was not real - also on workbook page
        80_RESULT_ROWS. That row now carries no C-value (no one sits behind it), and the row in front
        of the platform is checked against the wheelchair users' eye: at the front of the platform,
        at platform level, using the wheelchair eye height from your settings. Report names the
        platform rows. Tiers without a wheelchair platform are unchanged.

      The preview columns on page 10_INPUT_SECTION still use the regular eye height for every row;
      page 80_RESULT_ROWS has the analysed values.
  - version: "1.0.6"
    date: "2026-10-07"
    title: Custom vomitories can be stepped, stair or ramp
    body: |
      **Added**

      - **Custom Seat** - New optional input Vomitory, right below Stand 2D. Wire it from Vomitory and
        each vomitory you draw in Custom Voms gets its tier's descent - stepped, stair or ramp - from
        the Vomitory settings (until now every custom vomitory was built flat). Only the settings are
        used: your outlines stay exactly as drawn, and if one is too short for the headroom over the
        stairs, you are told where. Because the new input sits below Stand 2D, the inputs from
        Custom Voms down move one place. Older files reconnect by input name when opened; to get the
        new input in an older file, place a fresh Custom Seat.

      **Fixed**

      - **Custom Seat** - On a tier where you drew Custom Steps, automatic aisle cells were still added
        beside and behind vomitories, so cells you had removed came back. Your cells are now used as
        drawn, and a white note lists the spots left out.
      - **Rail 3D** - Where a vomitory's front edge lay exactly on the front of the tier, thin pieces of
        front railing could be left standing in the opening. The railing is now cleared across it.
      - **Vom 3D** - The note that the descent runs past the opening was orange even when the stairs
        simply pass out through the opening. It is now orange only when the stairs run into the end
        wall beside the opening; otherwise it is a white note with the length.
  - version: "1.0.5"
    date: "2026-10-07"
    title: Overlapping seats are removed
    body: |
      **Fixed**

      - **Seat and Custom Seat** - Two seats in the same tier could overlap, mostly where the rows turn
        at an axis line, for example at the corners of a chamfered bowl. Now only one is kept: the seat
        that reaches further across the axis line is removed. Even a small overlap removes a seat,
        because two chairs there would clash; seats in different tiers are never compared. Seat counts
        can be slightly lower than in 1.0.4 on curved and chamfered bowls.
      - **Seat** - A seat could overlap an aisle step beside a vomitory at the corners of a chamfered
        bowl. Seat now removes it, as Custom Seat already did, so the aisle stays clear.
  - version: "1.0.4"
    date: "2026-10-06"
    title: Shorter package description
    body: |
      **Fixed**

      - **Package** - The 1.0.3 package description lost its line breaks and was cut off on Food4Rhino.
        It is now a single short summary, and the package's website link goes to the Food4Rhino page,
        which links to the documentation and the video tutorial.

      No changes to the components.
  - version: "1.0.3"
    date: "2026-10-06"
    title: Sightlines line up with seat statuses again
    body: |
      **Fixed**

      - **C-value Seat and C-value Tread** - A seat or cell without a sightline (for example, no focal
        point in front of it) was skipped in *Sightlines*, so every line after the first gap moved up
        by one and filtering the sightlines by status picked the wrong lines. It now leaves an empty
        item, so *Sightlines* keep one item per seat or cell, in the same order as *Seat Statuses* and
        *Band Statuses*.
      - **C-value Seat** - *Map Hatches* skipped seats where a hatch could not be made. They now keep an
        empty item there, so they stay in step with *Seat C-Values*.
      - **Seat** - With a negative *End Offset* that removes a vomitory near the end of the stand,
        *Vom Shifts* still listed the removed vomitory, so the shifts no longer matched *Vom Rects*.
        It now lists only the vomitories that remain, in the same order as *Vom Rects*.

      **Added**

      - **Package** - The package page in Rhino's Package Manager links to the website, Food4Rhino and
        the YouTube tutorial, and the package includes a copy of the licence agreement
        (`misc/LICENSE.txt`).
  - version: "1.0.2"
    date: "2026-10-06"
    title: Report a problem and manage your subscription from the License component
    body: |
      **Added**

      - **License** - Right-click the License component for two new items. *Manage subscription* opens
        your customer portal. *Report a problem* opens the problem-report form with your Antlion, Rhino
        and Windows versions and your document units already attached, and copies the same details —
        with the last error message, if there was one — to the clipboard.

      **Fixed**

      - **License** - When Antlion had not been able to check your license for a while, the warning said
        "0 more day(s)" for the whole last day. It now counts the hours left.
  - version: "1.0.1"
    date: "2026-10-05"
    title: Inch documents — lengths read the way you set Rhino's units
    body: |
      **Fixed**

      - **Lengths in messages and reports** - Some messages rounded inch values to the whole inch (a
        minimum C-value of 2.5 in could read as `2in`), the same value could read differently from one
        message to another, and lengths ignored Rhino's unit display. A value you typed now comes back
        exactly as you typed it, reads the same in every message, two values a message compares never
        print as the same number, and lengths follow the distance display in Document Properties →
        Units: decimals (`4.75 in`), fractions (`4-3/4 in`) or Feet & Inches (`1'-6 3/8"`).
      - **Inch defaults** - New components in inch documents started from converted millimeter values.
        They now start from round inch values — for example a minimum C-value of 3-1/2 in, an optimal
        C-value of 4-3/4 in, an eye height of 48 in and a seat depth of 20 in. Values already in your
        files do not change, and millimeter documents are unchanged.
      - **Info window** - The plugin's contact link in Grasshopper's info window now points to the
        problem-report page.

      Tip — Grasshopper reads `12-3/4` typed into a panel as 12 minus 3/4. Type inch values as
      decimals (`12.75`).
  - version: "1.0.0"
    date: "2026-10-05"
    title: First public release — the seating bowl
    body: |
      **Added**

      It covers the seating bowl, from the field outline to the sightline drawings.

      *Build the bowl*

      - Field presets, with the focal point every sightline aims at. Rectangle, capsule and oval
        start lines, or your own curve.
      - Section axes laid out along the start line, or taken from your own axis curves.
      - Sections three ways — drawn as tread lines, solved from a target C-value, or read from a
        workbook — with front railings and wheelchair platforms.
      - Vomitories that run flat, step down or ramp down to the concourse.
      - Seats and aisles laid out automatically, or from your own seat, aisle and wheelchair-space
        curves.
      - Cuts and openings by axis number or by curve, chained one after another.
      - 3D solids for the stands, vomitories, railings, chairs and seated spectators.

      *Check the sightlines*

      - C-value per seat and per tread band across the whole bowl, colored by a legend you set.
      - Section checks with sightlines and dimensions, one sheet per axis.
      - C-value maps and seat maps on drawing sheets — zones, seat counts, wheelchair spaces and
        seat addresses.
      - A view from any seat, in the Perspective viewport.

      *Tables*

      - Step heights, tread depths, tier settings and the C-value target read from a Google Sheets
        or Excel workbook, with the results written back.

      *Also*

      - Millimeter and inch documents.
      - The Util panel works without a license.
      - Rhino 8 for Windows, running on .NET Core.
