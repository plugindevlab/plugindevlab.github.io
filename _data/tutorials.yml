      - { t: 2496, at: "41:36", name: "Change a Value, Everything Follows" }
  - id: Nz9T0EaU2UY
    title: "How to Design a Track and Field Stadium in Grasshopper"
    length: "32 min"
    thumb: /assets/img/antlion/tutorials/track-and-field.jpg
    thumb_alt: "A track and field stadium bowl modeled with Antlion, treads colored by C-value"
    summary: "The stands around a 400&nbsp;m running track, with the sections kept in an Excel workbook. You redraw the axes by hand with Custom Axis, write the sections as tables in Excel, draw your own vomitories for Custom Seat, join a second, VIP section to the main bowl, build it all in 3D, check <span class=\"nb\">C-value</span> sightlines seat by seat, and send the results back to Excel."
