  - id: MWOVvJcE1ig
    title: "How to Design a Three-Tier Soccer Stadium in Grasshopper"
    length: "42 min"
    thumb: /assets/img/antlion/tutorials/soccer-three-tier.jpg
    thumb_alt: "A three-tier soccer stadium bowl modelled with Antlion, seats coloured by C-value"
    summary: "A three-tier soccer bowl from an empty canvas to drawing sheets. You place the field, set the start line and section axes, build the three tiers in section, lay out vomitories, aisles and seats in plan, cut the openings, build it all in 3D, check <span class=\"nb\">C-value</span> sightlines seat by seat, and put the results on drawing sheets."
