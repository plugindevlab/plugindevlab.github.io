bowl-section-1:
  lead: |
    Place the field, draw where the front row starts, and set the axes the sections sit on.
    Everything downstream is measured from these.
  more_title: Four start-line shapes, one continuum
  more: |
    Grow the corner radius and a rectangle becomes a capsule, then an oval. A custom curve is
    the escape hatch when the shape is none of those — open curves are allowed.

bowl-section-2:
  lead: |
    Build the stair section that gets swept around the bowl, and attach extras such as railings
    and wheelchair platforms.
  more_title: Three ways in, one result
  more: |
    Read a line you drew, solve riser heights from a target C-value, or build the section from
    workbook numbers. All three produce the same object, and everything downstream cannot tell
    which way it came.

bowl-section-3:
  lead: |
    Unroll the section onto the plan, place vomitories and seats, and cut the bowl to shape.
  more_title: Most design decisions happen here
  more: |
    This is where the bowl stops being a profile and becomes a seating plan: where people walk
    in, how many seats fit, where the geometry stops.

bowl-section-4:
  lead: |
    Build what the 2D layout decided as real solids — tier stands, vomitory stairs, railings,
    seats.
  more_title: One wire into the analysis
  more: |
    From here the chain carries the 3D result inside a single bundled port, so the analysis
    stage needs one wire rather than many. Take it from the railings' result, which carries
    the rest, and the railings are checked too.

bowl-analysis:
  lead: |
    Check the design and produce evidence you can put in front of someone.
  more_title: Whole-bowl maps and single-section checks do different jobs
  more: |
    C-value is computed per seat and per tread band across the whole bowl, so you see **where**
    the design breaks down rather than checking one section and hoping. Section checks draw
    their dimensions and sightlines on the real cut — a number you report is a number you can
    defend. One examines one place rigorously; the others tell you which place to examine.

table: |
  Read inputs from Excel or Google Sheets and write results back. **Nothing talks to the network
  until you press Run.**

util: |
  Beside the chain, not in it: license registration, one panel for inputs, legends, a shared
  drawing-sheet format, and helpers for bundling per-tier values.
