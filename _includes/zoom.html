{%- if include.key -%}<button type="button" class="zoom" popovertarget="zoom-{{ include.id }}">{% include pic.html key=include.key dark=include.dark alt=include.alt sizes=include.sizes %}<span class="vh"> (enlarge)</span></button><div class="zoom-pop" id="zoom-{{ include.id }}" popover><button type="button" class="zoom-shut" popovertarget="zoom-{{ include.id }}" popovertargetaction="hide" aria-label="Close enlarged image">{% include pic.html key=include.key dark=include.dark alt=include.alt sizes="100vw" %}</button></div>{%- else -%}<button type="button" class="zoom" popovertarget="zoom-{{ include.id }}"><img src="{{ include.src | relative_url }}" alt="{{ include.alt }}"{% if include.w %} width="{{ include.w }}" height="{{ include.h }}"{% endif %}{% if include.lazy %} loading="lazy"{% endif %}><span class="vh"> (enlarge)</span></button><div class="zoom-pop" id="zoom-{{ include.id }}" popover><button type="button" class="zoom-shut" popovertarget="zoom-{{ include.id }}" popovertargetaction="hide" aria-label="Close enlarged image"><img src="{{ include.src | relative_url }}" alt="{{ include.alt }}" loading="lazy"></button></div>{%- endif -%}
