<button type="button" class="zoom" popovertarget="zoom-{{ include.id }}" aria-label="Enlarge image"><img src="{{ include.src | relative_url }}" alt="{{ include.alt }}"{% if include.w %} width="{{ include.w }}" height="{{ include.h }}"{% endif %}{% if include.lazy %} loading="lazy"{% endif %}></button><div class="zoom-pop" id="zoom-{{ include.id }}" popover><button type="button" class="zoom-shut" popovertarget="zoom-{{ include.id }}" popovertargetaction="hide" aria-label="Close enlarged image"><img src="{{ include.src | relative_url }}" alt="{{ include.alt }}" loading="lazy"></button></div>
