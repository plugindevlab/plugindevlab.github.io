{%- assign pdata = site.data.components.products[page.product] -%}
{%- assign r = pdata.graph.ribbon -%}
{%- if r %}
<div class="rib-wrap" markdown="0">
  <svg class="rib" viewBox="0 0 {{ r.w }} {{ r.h }}" width="{{ r.w }}" height="{{ r.h }}"
       role="img" aria-label="The {{ r.tab }} tab in the Grasshopper ribbon, with its panels">
    <rect class="rib-plate" x="0" y="0" width="{{ r.w }}" height="{{ r.h }}"/>
    <image href="{{ r.img | relative_url }}" x="{{ r.imgX }}" y="{{ r.imgY }}"
           width="{{ r.imgW }}" height="{{ r.imgH }}"/>
    <g class="rib-band">
      {%- for p in r.panels %}
      <rect x="{{ p.bx }}" y="{{ p.by }}" width="{{ p.bw }}" height="{{ r.barH }}" rx="1"/>
      {%- endfor %}
    </g>
    <g class="rib-lead">
      {%- for p in r.panels %}
      <path d="{{ p.d }}"/>
      {%- endfor %}
    </g>
    {%- for p in r.panels %}
    <g class="rib-call">
      <rect x="{{ p.x }}" y="{{ p.y }}" width="{{ p.w }}" height="{{ r.callH }}"/>
      <rect class="rib-call-top" x="{{ p.x }}" y="{{ p.y }}" width="{{ p.w }}" height="3"/>
      <text class="rib-name" x="{{ p.tx }}" y="{{ p.nameY }}">{{ p.name | escape }}</text>
      <text class="rib-count" x="{{ p.tx }}" y="{{ p.countY }}">{{ p.count }} components</text>
    </g>
    {%- endfor %}
  </svg>
</div>
{%- endif %}
