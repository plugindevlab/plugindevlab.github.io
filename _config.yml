title: plugin.dev.lab
description: Design-workflow plugins for Rhino and Grasshopper
lang: en

url: https://plugindevlab.com
baseurl: ""

prelaunch: false

f4r_url: "https://www.food4rhino.com/en/app/antlion"

plugins:
  - jekyll-sitemap
exclude:
  - _tools
  - README.md

defaults:
  - scope: { path: "" }
    values:
      layout: a
  - scope: { path: "antlion" }
    values:
      product: antlion
  - scope: { path: "antlion/components" }
    values:
      layout: default
